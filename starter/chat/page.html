<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Halcy · Travel chat</title>
    <style>
      :root { color-scheme: light; --ink: #182b2b; --muted: #586966; --line: #d9dfd8; --paper: #f5f3ed; --white: #fffefb; --green: #246451; --green-dark: #174838; --green-soft: #e7f0e9; --focus: #a65b23; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #e8eae4; color: var(--ink); font: 15px/1.45 "Avenir Next", "Trebuchet MS", sans-serif; }
      button, textarea { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      button:disabled { cursor: not-allowed; }
      .phone { width: min(100%, 460px); height: 100vh; height: 100dvh; margin: auto; display: flex; flex-direction: column; background: var(--paper); box-shadow: 0 0 60px #1f37371a; }
      header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--white); border-bottom: 1px solid var(--line); }
      .brand { display: flex; gap: 10px; align-items: center; }
      .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: var(--green); color: #fff8df; font: 21px/1 Georgia, serif; }
      .brand-name { font: 21px/1 Georgia, serif; letter-spacing: -.04em; }
      .header-action { border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 9px 10px; }
      .header-action:hover { background: var(--green-soft); color: var(--green-dark); }
      .header-action:active { transform: translateY(1px); }
      .header-action:disabled { opacity: .45; }
      #log { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 19px 16px 26px; display: flex; flex-direction: column; gap: 12px; }
      .msg { flex: 0 0 auto; max-width: 88%; padding: 11px 14px; border-radius: 17px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg.agent { align-self: flex-start; background: var(--white); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
      .msg.traveller { align-self: flex-end; background: var(--ink); color: white; border-bottom-right-radius: 6px; }
      .card, .activity { flex: 0 0 auto; align-self: flex-start; width: min(100%, 400px); background: var(--white); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 22px #182b2b0a; overflow: hidden; }
      .card img { display: block; width: 100%; height: auto; border-bottom: 1px solid var(--line); }
      .card .body { padding: 17px 17px 10px; }
      .card .title { font: 22px/1.14 Georgia, serif; letter-spacing: -.025em; margin-bottom: 10px; }
      .card .line { margin: 7px 0; color: #3d514d; overflow-wrap: anywhere; }
      .card .line:first-of-type { color: var(--ink); }
      .card a { color: var(--green-dark); font-weight: 700; text-underline-offset: 3px; }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 17px 17px; }
      .action { min-height: 44px; border: 1px solid var(--green); border-radius: 12px; padding: 10px 14px; background: var(--white); color: var(--green-dark); font-weight: 700; transition: background .15s, color .15s, transform .15s, box-shadow .15s; }
      .action.primary { background: var(--green); color: white; }
      .action:hover:not(:disabled) { background: var(--green-soft); box-shadow: 0 3px 10px #182b2b14; }
      .action.primary:hover:not(:disabled) { background: var(--green-dark); }
      .action:active:not(:disabled) { transform: translateY(1px) scale(.985); }
      .action:disabled { opacity: .48; box-shadow: none; }
      .action.chosen { opacity: 1; background: var(--green-soft); color: var(--green-dark); border-color: var(--green); }
      .action.primary.chosen { background: var(--green-dark); color: white; }
      .activity { padding: 13px 14px; display: flex; align-items: center; gap: 11px; border-color: #bfd3c5; background: #f8fbf7; }
      .activity-copy { flex: 1; min-width: 0; }
      .activity-title { display: block; color: var(--green-dark); font-weight: 700; }
      .activity-detail { color: var(--muted); font-size: 13px; }
      .spinner { width: 18px; height: 18px; flex: 0 0 auto; border: 2px solid #c7dbcc; border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
      .stop { min-height: 40px; border: 1px solid #becdc2; border-radius: 10px; padding: 6px 10px; background: white; color: var(--green-dark); font-weight: 700; }
      .stop:hover:not(:disabled) { background: var(--green-soft); }
      .stop:active:not(:disabled) { transform: translateY(1px); }
      .stop:disabled { opacity: .5; }
      .carousel { flex: 0 0 auto; width: 100%; align-self: stretch; }
      .carousel-top, .carousel-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px; }
      .carousel-top { margin-bottom: 10px; }
      .carousel-title { font: 19px/1.2 Georgia, serif; }
      .carousel-count { color: var(--muted); font-size: 13px; font-weight: 700; }
      .carousel-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: 1px; scrollbar-width: none; padding: 2px 24px 12px 2px; touch-action: pan-x pan-y; }
      .carousel-track::-webkit-scrollbar { display: none; }
      .carousel-track.dragging { scroll-snap-type: none; cursor: grabbing; user-select: none; }
      .carousel .card { align-self: auto; width: calc(100% - 27px); flex: 0 0 calc(100% - 27px); scroll-snap-align: start; }
      .carousel .card .title { font-size: 21px; }
      .carousel-bottom { min-height: 44px; }
      .carousel-nav { display: flex; gap: 7px; }
      .carousel-arrow { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 11px; background: var(--white); color: var(--ink); font-size: 20px; }
      .carousel-arrow:hover:not(:disabled) { border-color: var(--green); background: var(--green-soft); }
      .carousel-arrow:active:not(:disabled) { transform: translateY(1px); }
      .carousel-arrow:disabled { opacity: .35; }
      .carousel-dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; }
      .carousel-dot { display: grid; place-items: center; width: 30px; height: 40px; padding: 0; border: 0; background: transparent; }
      .carousel-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #acb8ae; transition: width .15s, background .15s; }
      .carousel-dot[aria-current="true"]::before { width: 19px; border-radius: 5px; background: var(--green); }
      .carousel-dot:hover::before { background: var(--green-dark); }
      .handoff { border-color: #b8cfc0; }
      .handoff-status { display: flex; align-items: center; gap: 9px; margin: 0 17px 6px; padding: 10px 12px; border-radius: 10px; background: var(--green-soft); color: var(--green-dark); font-weight: 700; }
      .handoff-status .spinner { width: 15px; height: 15px; }
      .handoff-status.waiting .spinner { animation-duration: 1.7s; }
      #examples { display: flex; gap: 7px; overflow-x: auto; padding: 4px 12px 9px; scrollbar-width: thin; }
      #examples button { flex: 0 0 auto; max-width: 275px; min-height: 38px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--white); color: var(--muted); text-align: left; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #examples button:hover { border-color: var(--green); color: var(--green-dark); }
      #examples button:active { transform: translateY(1px); }
      form { display: flex; align-items: end; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--white); }
      textarea { flex: 1; min-width: 0; min-height: 44px; height: 44px; max-height: 120px; padding: 10px 12px; border-radius: 13px; border: 1px solid #c5cfc6; background: #fff; color: var(--ink); resize: vertical; }
      textarea::placeholder { color: #778780; }
      #send { min-height: 44px; border: 1px solid var(--green); border-radius: 12px; padding: 0 16px; background: var(--green); color: white; font-weight: 700; }
      #send:hover:not(:disabled) { background: var(--green-dark); }
      #send:active:not(:disabled) { transform: translateY(1px); }
      #send:disabled { opacity: .5; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <div class="phone">
      <header><div class="brand"><span class="brand-mark" aria-hidden="true">h</span><span class="brand-name">Halcy</span></div><button class="header-action" id="reset" title="Clear the conversation">Clear chat</button></header>
      <div id="log" role="log" aria-label="Travel conversation" aria-live="polite" aria-relevant="additions text"></div>
      <div id="examples" aria-label="Example requests"></div>
      <form id="form"><textarea id="text" aria-label="Message Halcy" placeholder="Ask about your stay…" rows="1"></textarea><button id="send" type="submit" disabled>Send</button></form>
    </div>
    <script>
      const log = document.getElementById("log");
      const cards = new Map();
      const post = (path, body) => fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let activityEl = null;
      let activityState = "idle";
      let activityLabel = "";
      let sending = false;
      const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 100;
      const scrollToEnd = () => { log.scrollTop = log.scrollHeight; };

      function message(from, value) {
        if (from === "agent" && activityEl && activityState !== "idle") {
          activityEl.className = "msg agent";
          activityEl.removeAttribute("role");
          activityEl.removeAttribute("aria-label");
          activityEl.textContent = value;
          activityEl = null;
          addActivity();
          return;
        }
        const el = document.createElement("div");
        el.className = "msg " + from;
        el.textContent = value;
        log.appendChild(el);
      }

      function addActivity() {
        if (activityState === "idle" || activityEl) return;
        const el = document.createElement("div");
        el.className = "activity";
        el.setAttribute("role", "status");
        el.setAttribute("aria-label", "Agent activity");
        const spinner = document.createElement("span");
        spinner.className = "spinner";
        spinner.setAttribute("aria-hidden", "true");
        const copy = document.createElement("div");
        copy.className = "activity-copy";
        const title = document.createElement("span");
        title.className = "activity-title";
        const detail = document.createElement("span");
        detail.className = "activity-detail";
        copy.append(title, detail);
        const stop = document.createElement("button");
        stop.type = "button";
        stop.className = "stop";
        stop.textContent = "Stop";
        stop.title = "Stop assistance; this does not cancel a hotel reservation";
        stop.onclick = async () => {
          stop.disabled = true;
          stop.textContent = "Stopping…";
          try { const response = await post("/stop"); if (!response.ok) throw new Error("stop failed"); }
          catch { stop.disabled = false; stop.textContent = "Stop"; }
        };
        el.append(spinner, copy, stop);
        log.appendChild(el);
        activityEl = el;
        updateActivity();
      }
      function updateActivity() {
        if (!activityEl) return;
        activityEl.querySelector(".activity-title").textContent = activityState === "checking" ? "Checking confirmation" : activityLabel || "Working on your booking";
        activityEl.querySelector(".activity-detail").textContent = activityState === "checking" ? "Looking for the hotel's booking result" : "Halcy is working in the hotel browser";
      }
      function activity(state, label) {
        activityState = state;
        activityLabel = label || "";
        if (state === "idle") {
          activityEl?.remove();
          activityEl = null;
        } else {
          addActivity();
          updateActivity();
        }
      }

      function card(id, data, append = true) {
        const el = document.createElement("article");
        el.className = "card";
        if (data.title === "You control the hotel browser") el.classList.add("handoff");
        if (data.image) {
          const img = document.createElement("img");
          img.src = data.image;
          img.alt = "";
          el.appendChild(img);
        }
        const body = document.createElement("div");
        body.className = "body";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = data.title;
        body.appendChild(title);
        for (const value of data.lines ?? []) {
          const line = document.createElement("div");
          line.className = "line";
          line.textContent = value;
          body.appendChild(line);
        }
        if (data.link) {
          const a = document.createElement("a");
          a.href = data.link.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = data.link.label;
          body.appendChild(a);
        }
        el.appendChild(body);
        if (el.classList.contains("handoff")) {
          const status = document.createElement("div");
          status.className = "handoff-status waiting";
          status.innerHTML = '<span class="spinner" aria-hidden="true"></span><span class="handoff-status-text">Waiting for you in the hotel browser</span>';
          el.appendChild(status);
        }
        if (data.buttons?.length) {
          const row = document.createElement("div");
          row.className = "buttons";
          data.buttons.forEach((action, i) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "action" + (i === 0 ? " primary" : "");
            button.textContent = action.label;
            button.dataset.id = action.id;
            button.onclick = async () => {
              if (button.disabled) return;
              const group = [...el.querySelectorAll(".action")];
              if (action.id === "later" && el.classList.contains("handoff")) {
                button.disabled = true;
                button.textContent = "We'll wait";
              } else {
                group.forEach(b => b.disabled = true);
                button.classList.add("chosen");
                button.textContent = action.id === "check" ? "Checking…" : action.label;
              }
              try {
                const response = await post("/press", { card: id, button: action.id });
                if (!response.ok) throw new Error("action failed");
              } catch {
                group.forEach(b => b.disabled = false);
                button.classList.remove("chosen");
                button.textContent = action.label;
              }
            };
            row.appendChild(button);
          });
          el.appendChild(row);
        }
        cards.set(id, el);
        if (append) log.appendChild(el);
        return el;
      }
      function pressed(id, button) {
        const el = cards.get(id);
        if (!el) return;
        for (const b of el.querySelectorAll(".action")) {
          b.disabled = true;
          if (b.dataset.id === button) b.classList.add("chosen");
        }
      }
      function invalidate() {
        for (const el of cards.values()) for (const button of el.querySelectorAll(".action")) button.disabled = true;
      }
      function handoff(id, state) {
        const el = cards.get(id);
        if (!el) return;
        const status = el.querySelector(".handoff-status");
        if (!status) return;
        status.className = "handoff-status " + state;
        status.querySelector(".handoff-status-text").textContent = state === "checking" ? "Checking the hotel's confirmation" : "Waiting for you in the hotel browser";
        if (state === "waiting") {
          const later = el.querySelector('[data-id="later"]');
          if (later) { later.disabled = true; later.textContent = "We'll wait"; }
        } else {
          for (const button of el.querySelectorAll(".action")) button.disabled = true;
        }
      }
      function carousel(items) {
        if (!items.length) return;
        const wrap = document.createElement("section");
        wrap.className = "carousel";
        wrap.setAttribute("aria-label", "Room options");
        const top = document.createElement("div");
        top.className = "carousel-top";
        const heading = document.createElement("span");
        heading.className = "carousel-title";
        heading.textContent = "Room options";
        const count = document.createElement("span");
        count.className = "carousel-count";
        top.append(heading, count);
        const track = document.createElement("div");
        track.className = "carousel-track";
        track.setAttribute("aria-label", "Swipe or use controls to compare room options");
        const slides = items.map(({ id, card: data }, i) => {
          const slide = card(id, data, false);
          slide.setAttribute("aria-label", `Option ${i + 1} of ${items.length}`);
          track.appendChild(slide);
          return slide;
        });
        const bottom = document.createElement("div");
        bottom.className = "carousel-bottom";
        const nav = document.createElement("div");
        nav.className = "carousel-nav";
        const prev = document.createElement("button");
        const next = document.createElement("button");
        for (const [button, label, glyph] of [[prev, "Previous room", "‹"], [next, "Next room", "›"]]) {
          button.type = "button";
          button.className = "carousel-arrow";
          button.setAttribute("aria-label", label);
          button.textContent = glyph;
          nav.appendChild(button);
        }
        const dots = document.createElement("div");
        dots.className = "carousel-dots";
        const dotButtons = items.map((_, i) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "carousel-dot";
          dot.setAttribute("aria-label", `Show option ${i + 1} of ${items.length}`);
          dot.onclick = () => go(i);
          dots.appendChild(dot);
          return dot;
        });
        let index = 0;
        function render() {
          count.textContent = `${index + 1} of ${items.length}`;
          prev.disabled = index === 0;
          next.disabled = index === items.length - 1;
          dotButtons.forEach((dot, i) => dot.setAttribute("aria-current", String(i === index)));
        }
        function go(i) {
          index = Math.max(0, Math.min(items.length - 1, i));
          render();
          track.scrollTo({ left: slides[index].offsetLeft - track.offsetLeft, behavior: reducedMotion.matches ? "instant" : "smooth" });
        }
        prev.onclick = () => go(index - 1);
        next.onclick = () => go(index + 1);
        let frame = 0;
        track.addEventListener("scroll", () => {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(() => {
            const left = track.scrollLeft + track.offsetLeft;
            index = slides.reduce((best, slide, i) => Math.abs(slide.offsetLeft - left) < Math.abs(slides[best].offsetLeft - left) ? i : best, 0);
            render();
          });
        }, { passive: true });
        let drag = null;
        track.addEventListener("pointerdown", e => {
          if (e.pointerType !== "mouse" || e.button !== 0) return;
          drag = { x: e.clientX, scroll: track.scrollLeft, moved: false };
        });
        track.addEventListener("pointermove", e => {
          if (!drag) return;
          if (Math.abs(e.clientX - drag.x) > 6) {
            drag.moved = true;
            track.classList.add("dragging");
            track.scrollLeft = drag.scroll - (e.clientX - drag.x);
          }
        });
        const endDrag = () => { if (drag?.moved) setTimeout(() => track.classList.remove("dragging"), 0); drag = null; };
        track.addEventListener("pointerup", endDrag);
        track.addEventListener("pointercancel", endDrag);
        track.addEventListener("pointerleave", endDrag);
        track.addEventListener("click", e => { if (track.classList.contains("dragging")) { e.preventDefault(); e.stopPropagation(); } }, true);
        bottom.append(nav, dots);
        wrap.append(top, track, bottom);
        log.appendChild(wrap);
        render();
      }

      const events = new EventSource("/events");
      events.onmessage = event => {
        const e = JSON.parse(event.data);
        const stick = nearBottom();
        if (e.type === "message") message(e.from, e.text);
        if (e.type === "card") card(e.id, e.card);
        if (e.type === "carousel") carousel(e.cards);
        if (e.type === "pressed") pressed(e.card, e.button);
        if (e.type === "handoff") handoff(e.card, e.state);
        if (e.type === "activity") activity(e.state, e.label);
        if (e.type === "busy") document.getElementById("reset").disabled = e.on;
        if (e.type === "invalidate") invalidate();
        if (e.type === "reset") { log.replaceChildren(); cards.clear(); activityEl = null; activityState = "idle"; }
        if (stick || e.type === "reset" || e.type === "message" && e.from === "traveller") scrollToEnd();
      };

      const input = document.getElementById("text");
      const sendButton = document.getElementById("send");
      const updateSend = () => { sendButton.disabled = sending || !input.value.trim(); };
      async function send() {
        const value = input.value.trim();
        if (!value || sending) return;
        sending = true;
        sendButton.disabled = true;
        sendButton.textContent = "Sending…";
        try {
          const response = await post("/send", { text: value });
          if (!response.ok) throw new Error("send failed");
          input.value = "";
        } finally {
          sending = false;
          updateSend();
          sendButton.textContent = "Send";
        }
      }
      input.addEventListener("input", updateSend);
      document.getElementById("form").onsubmit = e => { e.preventDefault(); send().catch(() => { sendButton.textContent = "Try again"; }); };
      input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send().catch(() => { sendButton.textContent = "Try again"; }); } };
      document.getElementById("reset").onclick = async () => {
        const button = document.getElementById("reset");
        button.disabled = true;
        try { await post("/reset"); } finally { button.disabled = false; }
      };
      fetch("/examples").then(r => r.json()).then(list => {
        const box = document.getElementById("examples");
        for (const example of list) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = example;
          button.title = example;
          button.onclick = () => { input.value = example; updateSend(); input.focus(); };
          box.appendChild(button);
        }
      });
    </script>
  </body>
</html>
