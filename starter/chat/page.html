<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chat</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e9e9e9; font: 15px/1.4 system-ui, -apple-system, sans-serif; color: #181818; }
      .phone { max-width: 420px; height: 100vh; height: 100dvh; margin: 0 auto; background: #fafafa; display: flex; flex-direction: column; }
      header { padding: 14px 16px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
      header strong { font-weight: 600; }
      header button { font: inherit; font-size: 13px; background: none; border: 0; color: #5c5c5c; cursor: pointer; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
      .agent { align-self: flex-start; background: #fff; border: 1px solid #e3e3e3; }
      .traveller { align-self: flex-end; background: #181818; color: #fff; }
      .card { align-self: flex-start; width: 88%; background: #fff; border: 1px solid #d6d6d6; border-radius: 14px; overflow: hidden; }
      .card img { display: block; width: 100%; border-bottom: 1px solid #eee; }
      .card .body { padding: 12px 14px; }
      .card .title { font-weight: 600; margin-bottom: 4px; }
      .card .line { color: #444; }
      .card a { display: inline-block; margin-top: 8px; color: #181818; }
      .card .buttons { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 14px; }
      .card button { font: inherit; padding: 9px 14px; border-radius: 999px; border: 1px solid #181818; background: #fff; cursor: pointer; }
      .card button.primary { background: #181818; color: #fff; }
      .card button:disabled { opacity: 0.4; cursor: default; }
      .card button.chosen { opacity: 1; outline: 2px solid #181818; outline-offset: 2px; }
      #busy { padding: 0 16px 6px; color: #5c5c5c; font-size: 13px; min-height: 20px; }
      #examples { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 8px; }
      #examples button { flex: 0 0 auto; max-width: 260px; font: inherit; font-size: 13px; text-align: left; padding: 7px 11px; border-radius: 12px; border: 1px solid #d6d6d6; background: #fff; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #ddd; }
      textarea { flex: 1; font: inherit; padding: 10px 12px; border-radius: 18px; border: 1px solid #ccc; resize: none; height: 42px; }
      form button { font: inherit; padding: 0 16px; border-radius: 18px; border: 0; background: #181818; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header><strong>Halcy</strong><button id="reset" title="Clear the conversation">Clear</button></header>
      <div id="log" aria-live="polite"></div>
      <div id="busy"></div>
      <div id="examples"></div>
      <form id="form"><textarea id="text" placeholder="Message" rows="1"></textarea><button>Send</button></form>
    </div>
    <script>
      const log = document.getElementById("log");
      const cards = new Map();
      const post = (path, body) =>
        fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
      const scroll = () => (log.scrollTop = log.scrollHeight);

      function message(from, text) {
        const el = document.createElement("div");
        el.className = "msg " + from;
        el.textContent = text;
        log.appendChild(el);
      }

      function card(id, c) {
        const el = document.createElement("div");
        el.className = "card";
        if (c.image) {
          const img = document.createElement("img");
          img.src = c.image;
          img.alt = "";
          el.appendChild(img);
        }
        const body = document.createElement("div");
        body.className = "body";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = c.title;
        body.appendChild(title);
        for (const l of c.lines ?? []) {
          const line = document.createElement("div");
          line.className = "line";
          line.textContent = l;
          body.appendChild(line);
        }
        if (c.link) {
          const a = document.createElement("a");
          a.href = c.link.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = c.link.label;
          body.appendChild(a);
        }
        el.appendChild(body);
        if (c.buttons?.length) {
          const row = document.createElement("div");
          row.className = "buttons";
          c.buttons.forEach((b, i) => {
            const btn = document.createElement("button");
            btn.textContent = b.label;
            btn.dataset.id = b.id;
            if (i === 0) btn.className = "primary";
            btn.onclick = () => post("/press", { card: id, button: b.id });
            row.appendChild(btn);
          });
          el.appendChild(row);
        }
        cards.set(id, el);
        log.appendChild(el);
      }

      function pressed(id, button) {
        const el = cards.get(id);
        if (!el) return;
        for (const b of el.querySelectorAll("button")) {
          b.disabled = true;
          if (b.dataset.id === button) b.classList.add("chosen");
        }
      }

      const events = new EventSource("/events");
      events.onmessage = (m) => {
        const e = JSON.parse(m.data);
        if (e.type === "message") message(e.from, e.text);
        if (e.type === "card") card(e.id, e.card);
        if (e.type === "pressed") pressed(e.card, e.button);
        if (e.type === "busy") document.getElementById("busy").textContent = e.on ? "Halcy is working…" : "";
        if (e.type === "reset") { log.innerHTML = ""; cards.clear(); }
        scroll();
      };

      const text = document.getElementById("text");
      function send() {
        const t = text.value.trim();
        if (!t) return;
        text.value = "";
        post("/send", { text: t });
      }
      document.getElementById("form").onsubmit = (e) => { e.preventDefault(); send(); };
      text.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
      document.getElementById("reset").onclick = () => post("/reset");

      fetch("/examples").then((r) => r.json()).then((list) => {
        const box = document.getElementById("examples");
        for (const ex of list) {
          const b = document.createElement("button");
          b.textContent = ex;
          b.title = ex;
          b.onclick = () => { text.value = ex; text.focus(); };
          box.appendChild(b);
        }
      });
    </script>
  </body>
</html>
